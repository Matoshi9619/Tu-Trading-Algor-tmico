name: Velas cada hora

on:
  schedule:
    # Lunes a viernes, cada hora de 13:05 a 21:05 UTC (cubre el horario de la bolsa de Nueva York todo el año)
    - cron: "5 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  velas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar librerías
        run: pip install -r motor/requirements.txt

      - name: Descargar velas
        run: python motor/velas.py

      - name: Guardar resultados
        run: |
          git config user.name "robot-inversion"
          git config user.email "robot-inversion@users.noreply.github.com"
          git add docs/velas.json
          git diff --cached --quiet && exit 0
          git commit -m "Velas $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
