<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trading Algorítmico</title>
<meta name="description" content="Práctica familiar de inversión con robots y precios reales">
<meta name="theme-color" content="#1C1C22">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="app-v2.webmanifest">
<link rel="icon" href="logo-v2-192.png">
<link rel="apple-touch-icon" href="logo-v2-apple.png">
<style>
:root{
  --fondo:#F4F5F7; --tarjeta:#FFFFFF; --tinta:#101828; --suave:#5D6878; --borde:#E2E5EA;
  --azul:#091F36; --azul2:#2C5A8C; --titulo:#091F36; --enlace:#2C5A8C; --dorado:#A9813E;
  --verde:#157F3D; --verde-f:#E7F4EB; --verde-btn:#157F3D; --rojo:#BF3328; --rojo-f:#FBEAE8; --rojo-btn:#BF3328;
  --ambar:#A16207; --ambar-f:#FDF3DF; --ico:#EEF1F6; --aviso:#EEF3FA; --oro-f:#F7F0E3; --grid:#E7E9ED; --pista:#ECEEF2;
  --campo:#FFFFFF; --cab:rgba(244,245,247,.92); --sombra:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.05);
  --s-verde:#BFE3CB; --s-amarillo:#F2D9A6; --s-rojo:#F3C3BD; --radio:16px;
}
[data-tema=oscuro]{
  --fondo:#0D1117; --tarjeta:#161B22; --tinta:#E6E9EE; --suave:#98A2B3; --borde:#272E38;
  --azul:#24406A; --azul2:#7FA7D6; --titulo:#F2F4F7; --enlace:#8DB4E2; --dorado:#D2A85D;
  --verde:#4CC27E; --verde-f:#11291B; --verde-btn:#1E8449; --rojo:#F07A6E; --rojo-f:#33171A; --rojo-btn:#B83A2E;
  --ambar:#EFB44A; --ambar-f:#2E2410; --ico:#1F2630; --aviso:#162131; --oro-f:#2A2215; --grid:#232A34; --pista:#212833;
  --campo:#0F1419; --cab:rgba(13,17,23,.92); --sombra:0 1px 2px rgba(0,0,0,.4);
  --s-verde:#1F5133; --s-amarillo:#5A4515; --s-rojo:#5C2620;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:19px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:0 auto;padding:0 16px 120px}
h1{font-size:29px;line-height:1.15;margin:14px 0 4px;color:var(--titulo);letter-spacing:-.4px;font-weight:800}
h2{font-size:23px;line-height:1.2;margin:30px 0 10px;color:var(--titulo);letter-spacing:-.2px;font-weight:700}
h3{font-size:20px;margin:0 0 4px;font-weight:700}
p{margin:0 0 12px}
.sub{color:var(--suave);font-size:16px}
.chica{font-size:15px;color:var(--suave)}
button,select,input,textarea{font:inherit;color:inherit}
.oculto{display:none!important}
.grande,.pill,.banner b,.lista b,.periodos b{font-variant-numeric:tabular-nums}

/* barra superior */
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;margin:0 -16px 4px;padding:10px 16px;
  background:var(--cab);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--borde)}
.appbar img{width:36px;height:36px;border-radius:9px}
.appbar .marca{font-weight:800;font-size:18px;letter-spacing:-.2px;color:var(--titulo);line-height:1.1}
.appbar .marca small{display:block;font-weight:500;font-size:13px;color:var(--suave);letter-spacing:0}
.atras{display:inline-flex;align-items:center;gap:6px;background:var(--azul);color:#fff;border:0;border-radius:12px;padding:10px 16px 10px 12px;
  font-size:18px;font-weight:700;cursor:pointer;min-height:48px}
.atras svg{width:22px;height:22px}
.engranaje{margin-left:auto;background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;width:48px;height:48px;display:grid;place-items:center;cursor:pointer;color:var(--tinta)}

/* navegación inferior */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tarjeta);border-top:1px solid var(--borde);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
#nav .in{display:flex;width:100%;max-width:640px}
#nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;cursor:pointer;
  color:var(--suave);font-size:13px;font-weight:600;border-radius:12px;min-height:58px}
#nav button svg{width:26px;height:26px}
#nav button[aria-current=page]{color:var(--enlace)}
#nav button[aria-current=page] svg{background:var(--aviso);border-radius:10px;padding:3px;width:40px;height:30px}

/* inicio */
.hero{background:linear-gradient(135deg,#091F36 0%,#14365C 100%);color:#fff;border-radius:20px;padding:20px;margin:14px 0 6px;position:relative;overflow:hidden}
.hero h1{color:#fff;margin:0 0 4px;font-size:26px}
.hero p{color:#C9D5E6;margin:0;font-size:16px}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(210,168,93,.18)}
.botones{display:grid;gap:12px;margin-top:16px}
@media(min-width:760px){.botones{grid-template-columns:1fr 1fr}}
.boton{display:flex;align-items:center;gap:16px;width:100%;text-align:left;color:var(--tinta);background:var(--tarjeta);border:1px solid var(--borde);
  border-radius:var(--radio);padding:16px;cursor:pointer;min-height:92px;box-shadow:var(--sombra);transition:transform .08s}
.boton:active{transform:scale(.985)}
.boton:focus-visible,.atras:focus-visible,.chip:focus-visible,#nav button:focus-visible{outline:3px solid var(--azul2);outline-offset:2px}
.boton .ico{flex:0 0 56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:30px;background:var(--ico);color:var(--enlace)}
.boton .ico svg{width:30px;height:30px}
.boton b{display:block;font-size:21px;line-height:1.2;color:var(--tinta)}
.boton span{display:block;color:var(--suave);font-size:16px;margin-top:2px}
.boton .flecha{margin-left:auto;font-size:28px;color:var(--suave)}

/* semaforo */
.semaforo{display:flex;gap:16px;align-items:center;border-radius:var(--radio);padding:16px 18px;border:1px solid transparent;cursor:pointer;width:100%;text-align:left;color:var(--tinta)}
.semaforo .luz{flex:0 0 48px;height:48px;border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.15)}
.semaforo b{font-size:22px;display:block;line-height:1.2}
.s-verde{background:var(--verde-f);border-color:var(--s-verde)}.s-verde .luz{background:#2E9E5B}
.s-amarillo{background:var(--ambar-f);border-color:var(--s-amarillo)}.s-amarillo .luz{background:#E9A23B}
.s-rojo{background:var(--rojo-f);border-color:var(--s-rojo)}.s-rojo .luz{background:#D64535}

/* componentes */
.volver{display:inline-flex;align-items:center;gap:10px;background:var(--azul);color:#fff;border:0;border-radius:14px;padding:14px 22px;
  font-size:20px;font-weight:700;cursor:pointer;min-height:56px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio);padding:18px;margin:12px 0;box-shadow:var(--sombra)}
.grid2{display:grid;gap:12px}
.grid2>*,.tarjeta{min-width:0}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.grande{font-size:34px;font-weight:800;line-height:1.1;letter-spacing:-.8px}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:700;font-size:17px;white-space:nowrap}
.sube{background:var(--verde-f);color:var(--verde)}.baja{background:var(--rojo-f);color:var(--rojo)}.igual{background:var(--pista);color:var(--suave)}
.fila{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.periodos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
@media(min-width:1100px){.periodos{grid-template-columns:repeat(4,1fr)}}
.periodos div{background:var(--pista);border-radius:12px;padding:8px;text-align:center}
.periodos small{display:block;color:var(--suave);font-size:14px}
.aviso{background:var(--aviso);border-left:5px solid var(--azul2);border-radius:12px;padding:14px 16px;margin:14px 0}
.aviso.oro{background:var(--oro-f);border-color:var(--dorado)}
.banner{background:linear-gradient(135deg,#091F36 0%,#14365C 100%);color:#fff;border-radius:var(--radio);padding:20px;margin:12px 0}
.banner b{font-size:23px;display:block;line-height:1.25}
.banner .chica{color:#C9D5E6}
.robot{cursor:pointer}
.robot .cab{display:flex;align-items:center;gap:10px}
.punto{flex:0 0 14px;height:14px;border-radius:50%}
.ref{background:var(--dorado);color:#fff;font-size:12px;font-weight:800;border-radius:6px;padding:2px 8px;letter-spacing:.5px}
.mas{color:var(--enlace);font-size:16px;font-weight:600;margin-top:6px}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 0;font-size:16px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:22px;height:5px;border-radius:3px;display:inline-block}
svg text{font-family:inherit}
.lista{list-style:none;padding:0;margin:0}
.lista li{padding:12px 0;border-bottom:1px solid var(--borde)}
.lista li:last-child{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--borde);background:var(--tarjeta);border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:52px;font-size:18px;color:var(--tinta)}
.chip[aria-pressed=true]{background:var(--azul);border-color:var(--azul);color:#fff}
.chip:disabled{opacity:.35;cursor:default}
.ancho{width:100%;justify-content:center}
.pasos div{display:flex;gap:14px;align-items:flex-start;margin:12px 0}
.pasos span{flex:0 0 40px;height:40px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.pasos p{margin:6px 0 0}
.ficha p{margin:0 0 12px}
.explica{background:var(--verde-f);border-radius:12px;padding:12px 14px;margin:10px 0}
.explica .chica{display:block;margin-top:4px}
.soles{display:block;font-size:15px;opacity:.85;font-weight:500}
label.campo{display:block;font-weight:700;margin:16px 0 8px}
select,input[type=number],textarea{width:100%;min-height:58px;border:1px solid var(--borde);border-radius:14px;padding:10px 14px;background:var(--campo);font-size:20px;color:var(--tinta)}
textarea{min-height:auto;font-size:14px}
.barras .b{margin:10px 0}
.barras .t{display:flex;justify-content:space-between;gap:10px;font-size:17px}
.barras .pista{height:12px;background:var(--pista);border-radius:8px;position:relative;overflow:hidden;margin-top:4px}
.barras .pista i{position:absolute;top:0;bottom:0;border-radius:8px}
details{background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio);margin:10px 0;padding:0 18px;box-shadow:var(--sombra)}
summary{cursor:pointer;font-weight:700;font-size:20px;padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--enlace)}
details[open] summary::after{content:"－"}
details p,details ul{padding-bottom:6px}
footer{margin-top:30px;color:var(--suave);font-size:14px;text-align:center}
.cargando{padding:60px 0;text-align:center;color:var(--suave)}
.boton-tarjeta{display:block;width:100%;text-align:left;cursor:pointer;color:var(--tinta);font:inherit}
.tres{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.tres .tarjeta{margin:0;display:flex;flex-direction:column;gap:2px}
.tres .tarjeta:last-child{grid-column:1 / -1}
.tres .grande{font-size:26px}
@media(min-width:760px){.tres{grid-template-columns:1fr 1fr 1fr}.tres .tarjeta:last-child{grid-column:auto}}
.t-sube{color:var(--verde)}.t-baja{color:var(--rojo)}
.tabla-rank .pos{font-size:22px;font-weight:800;color:var(--suave);width:34px;flex:0 0 34px}
.ajuste{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--borde)}
.ajuste:last-child{border-bottom:0}
.interruptor{position:relative;flex:0 0 64px;height:36px;border-radius:999px;background:var(--pista);border:1px solid var(--borde);cursor:pointer}
.interruptor:after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.interruptor[aria-checked=true]{background:var(--verde-btn);border-color:var(--verde-btn)}
.interruptor[aria-checked=true]:after{left:31px}
</style>
</head>
<body>
<main id="app"><div class="cargando">Cargando datos…</div></main>
<nav id="nav" aria-label="Menú principal"><div class="in"></div></nav>

<script>
"use strict";
const COLORES = ["var(--r1)","var(--r2)","var(--r3)","var(--r4)","var(--r5)","var(--r6)"];
const HEX_CLARO = ["#7D8796","#B08D57","#1F3A5F","#2E86AB","#7B4FA0","#D9822B"];
const HEX_OSCURO = ["#9AA4B2","#C9A35F","#7FA7D6","#38BDF8","#B48CE0","#F0A35C"];
let HEX = HEX_CLARO.slice();
const ACT = {SPY:"Acciones de EE. UU.",EFA:"Acciones del resto del mundo",IEF:"Bonos del gobierno de EE. UU.",SHY:"Bonos de corto plazo"};
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
let D = null;
const $app = document.getElementById("app");

/* ---------- formato ---------- */
const usd = (x, dec = 0) => "US$ " + Number(x).toLocaleString("es-PE", {minimumFractionDigits: dec, maximumFractionDigits: dec});
const sol = x => "S/ " + Math.round(x).toLocaleString("es-PE");
const pct = (x, dec = 1) => { const v = Math.round(x * 100 * 10 ** dec) / 10 ** dec; return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toLocaleString("es-PE", {minimumFractionDigits: dec, maximumFractionDigits: dec}) + "%"; };
const fecha = iso => { const [a, m, d] = iso.slice(0, 10).split("-"); return `${+d} ${MESES[+m - 1]} ${a}`; };
const clase = x => x > 0.0005 ? "sube" : x < -0.0005 ? "baja" : "igual";
const flecha = x => x > 0.0005 ? "▲" : x < -0.0005 ? "▼" : "●";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const enSoles = x => AJ.soles && D && D.mercado ? `<span class="soles">≈ S/ ${Math.round(x * D.mercado.tipo_cambio).toLocaleString("es-PE")}</span>` : "";
const tiene = pesos => {
  const p = Object.entries(pesos || {}).filter(([, w]) => w > 0.01).sort((a, b) => b[1] - a[1]);
  const resto = 1 - p.reduce((s, [, w]) => s + w, 0);
  if (resto > 0.01) p.push(["Efectivo", resto]);
  if (!p.length || (p.length === 1 && p[0][0] === "Efectivo")) return "Todo en efectivo (esperando su momento)";
  if (p.length === 1) return "Todo en " + ACT[p[0][0]];
  return p.map(([t, w]) => Math.round(w * 100) + "% " + (ACT[t] || t)).join(" + ");
};

/* ---------- gráfico de líneas en SVG ---------- */
function grafico(series, {alto = 260, log = false, base = null, marca = null, etiquetasX = null} = {}) {
  const chico = window.innerWidth < 600, fs = chico ? 13 : 15;
  const W = chico ? 400 : 760, H = chico ? Math.round(alto * 0.8) : alto, L = chico ? 68 : 80, R = 10, T = 12, B = chico ? 26 : 34;
  const n = Math.max(...series.map(s => s.valores.length));
  if (n < 2) return '<p class="chica">El gráfico aparece cuando haya al menos 2 días de datos.</p>';
  const vals = series.flatMap(s => s.valores).filter(v => v != null && v > 0);
  let lo = Math.min(...vals, base ?? Infinity), hi = Math.max(...vals, base ?? -Infinity);
  const f = log ? Math.log : (v => v);
  let a = f(lo), b = f(hi); if (a === b) { a -= 1; b += 1; }
  const pad = (b - a) * 0.06; a -= pad; b += pad;
  const X = i => L + (W - L - R) * i / (n - 1);
  const Y = v => T + (H - T - B) * (1 - (f(v) - a) / (b - a));
  let g = "";
  // marcas eje Y con números redondos
  let ticks = [];
  const lo2 = log ? Math.exp(a) : a, hi2 = log ? Math.exp(b) : b;
  if (log) {
    for (let e = Math.floor(Math.log10(lo2)); e <= Math.ceil(Math.log10(hi2)); e++)
      for (const m of [1, 2, 5]) { const t = m * 10 ** e; if (t >= lo2 && t <= hi2) ticks.push(t); }
    if (ticks.length > 6) ticks = ticks.filter(t => String(t)[0] === "1" || String(t)[0] === "5");
  } else {
    const crudo = (hi2 - lo2) / 4, p10 = 10 ** Math.floor(Math.log10(crudo));
    const paso = [1, 2, 2.5, 5, 10].map(m => m * p10).find(v => v >= crudo);
    for (let t = Math.ceil(lo2 / paso) * paso; t <= hi2 + 1e-9; t += paso) ticks.push(t);
  }
  const dec = ticks.some(t => Math.abs(t - Math.round(t)) > 1e-6) ? (ticks.some(t => Math.abs(t * 10 - Math.round(t * 10)) > 1e-6) ? 2 : 1) : 0;
  ticks.forEach(t => { const y = Y(t);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" style="stroke:var(--grid)"/>`;
    g += `<text x="${L - 6}" y="${y + 5}" text-anchor="end" font-size="${fs}" style="fill:var(--suave)">${t.toLocaleString("es-PE", {maximumFractionDigits: dec, minimumFractionDigits: dec})}</text>`; });
  if (base != null) g += `<line x1="${L}" x2="${W - R}" y1="${Y(base)}" y2="${Y(base)}" style="stroke:var(--tinta)" stroke-dasharray="6 5" stroke-width="1.2"/>`;
  if (marca != null) g += `<line x1="${X(marca)}" x2="${X(marca)}" y1="${T}" y2="${H - B}" stroke="#9C7A45" stroke-dasharray="5 5" stroke-width="1.5"/>`;
  if (etiquetasX) etiquetasX.forEach(([i, txt], j, arr) => {
    const anc = j === 0 && arr.length <= 2 ? "start" : j === arr.length - 1 && arr.length <= 2 ? "end" : "middle";
    g += `<text x="${X(i)}" y="${H - 8}" text-anchor="${anc}" font-size="${fs}" style="fill:var(--suave)">${txt}</text>`; });
  series.forEach(s => {
    const pts = s.valores.map((v, i) => v == null ? null : `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(" ");
    g += `<polyline points="${pts}" fill="none" style="stroke:${s.color}" stroke-width="${(s.grueso ? 4 : 2.6) * (chico ? 0.75 : 1)}" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico">${g}</svg>`;
}
function leyenda(nombres) {
  return `<div class="leyenda">${nombres.map((n, i) => `<span><i style="background:${HEX[i]}"></i>${esc(n)}</span>`).join("")}</div>`;
}
function ejeAnios(meses) {
  const out = []; meses.forEach((m, i) => { const y = +m.slice(0, 4);
    if (m.endsWith("-01") && (y % (window.innerWidth < 600 ? 6 : 4) === 0)) out.push([i, String(y)]); });
  return out;
}

/* ---------- pantallas ---------- */
/* ---------- iconos (trazo simple) ---------- */
const ICONOS = {
  inicio: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  mercado: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  simulador: '<rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M3 10h18M16 15h2"/><path d="M7 6V4.5A1.5 1.5 0 0 1 8.5 3h7A1.5 1.5 0 0 1 17 4.5V6"/>',

function horaLima() { return new Date(new Date().toLocaleString("en-US", {timeZone: "America/Lima"})); }
function avisosHoy(c) {
  const out = [], ahora = horaLima(), ny = new Date(new Date().toLocaleString("en-US", {timeZone: "America/New_York"}));
  const dia = ny.getDay();
  // fin de mes: los robots mensuales deciden el último día hábil
  const ultimoHabil = (() => { const d = new Date(ny.getFullYear(), ny.getMonth() + 1, 0); while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() - 1); return d.getDate(); })();
  const faltan = ultimoHabil - ny.getDate();
  if (dia >= 1 && dia <= 5 && faltan === 0) out.push(["📅", "Hoy es el último día hábil del mes", "Al cierre de la bolsa, varios robots revisan sus decisiones. Mañana mira si alguno cambió de idea."]);
  else if (faltan > 0 && faltan <= 3) out.push(["📅", `Se acerca fin de mes (en ${faltan} día${faltan === 1 ? "" : "s"})`, "El último día hábil del mes varios robots revisan sus decisiones."]);
  if (dia === 0 || dia === 6) out.push(["😴", "Hoy la bolsa descansa", "Es fin de semana: los precios no se mueven hasta el lunes. Buen momento para leer y aprender."]);
  if (c && c.sigue != null && D.robots.robots[c.sigue] && difiere(c, c.sigue))
    out.push(["🤖", `El robot «${D.robots.robots[c.sigue].nombre}» cambió de idea`, c.auto ? "Entra a tu simulador y tu dinero se acomodará solo." : "Entra a tu simulador si quieres volver a copiarlo."]);
  return out;
}

function calculadora() {

  let k = H.meses.indexOf(`${calc.anio}-${String(calc.mes).padStart(2, "0")}`);
  if (k < 0) k = calc.anio === primero ? 0 : H.meses.length - 2;
  k = Math.min(k, H.meses.length - 2);
  const res = H.metricas.map((m, i) => {
    const c = H.curvas[m.id], last = c[c.length - 1];
    let valorFin, puesto, peor = Infinity, peorRel = 0;
    if (calc.modo === "una") {
      puesto = calc.monto; valorFin = calc.monto * last / c[k];
      for (let t = k; t < c.length; t++) { const v = calc.monto * c[t] / c[k]; if (v < peor) peor = v; }

      valorFin = unidades * last;
    }

      `<button class="chip" aria-pressed="${calc.monto === v}" onclick="calc.monto=${v};pintar()">${usd(v)}</button>`).join("")}</div>
    <input id="monto" type="number" inputmode="numeric" min="1" value="${calc.monto}" onchange="calc.monto=Math.max(1,+this.value||1);pintar()">

      `Si desde ${MESES_L[+H.meses[k].slice(5) - 1]} de ${H.meses[k].slice(0, 4)} hubieras puesto ${usd(calc.monto)} cada mes (en total ${usd(top.puesto)}) con el mejor robot (${esc(top.nombre)}), hoy tendrías:`}</span>

/* precio más reciente: la última vela de 15 minutos si existe, si no el cierre diario */
function ultimo(t) {
  const v = VELAS && VELAS[t] && VELAS[t]["15m"];
  if (v && v.length) { const b = v[v.length - 1]; return {precio: b[4], cuando: b[0]}; }

function precios() { const p = {}; ORDEN.forEach(t => p[t] = ultimo(t).precio); return p; }
function cuandoTxt(s) {
  const [f, h] = s.split(" "); if (!h) return "cierre del " + fecha(f);
  let [hh, mm] = h.split(":").map(Number); const ap = hh >= 12 ? "p.m." : "a.m."; hh = hh % 12 || 12;
  return `${fecha(f)}, ${hh}:${String(mm).padStart(2, "0")} ${ap} (hora de Lima)`;
}
function bolsaAbierta() {
  const ny = new Date(new Date().toLocaleString("en-US", {timeZone: "America/New_York"}));
  const d = ny.getDay(), m = ny.getHours() * 60 + ny.getMinutes();
  return d >= 1 && d <= 5 && m >= 570 && m < 960;
}
function horarioLima() {   // 9:30 a 16:00 en Nueva York, convertido a hora de Lima
  const ahora = new Date();
  const ny = new Date(ahora.toLocaleString("en-US", {timeZone: "America/New_York"}));
  const li = new Date(ahora.toLocaleString("en-US", {timeZone: "America/Lima"}));
  const dif = Math.round((li - ny) / 3600000);
  const h = x => { const hh = ((x % 24) + 24) % 24, e = Math.floor(hh), m = Math.round((hh - e) * 60);
    return `${e % 12 || 12}:${String(m).padStart(2, "0")} ${e >= 12 ? "p.m." : "a.m."}`; };
  return `de ${h(9.5 + dif)} a ${h(16 + dif)}`;
}
function valorCuenta(c) { const p = precios(); return c.efectivo + Object.entries(c.pos).reduce((s, [t, u]) => s + u * p[t], 0); }
function pesosCuenta(c) { const p = precios(), tot = valorCuenta(c), w = {}; ORDEN.forEach(t => w[t] = (c.pos[t] || 0) * p[t] / tot); return w; }
function anotarValor(c) {
  const f = D.fecha_precios > (ultimo("SPY").cuando || "").slice(0, 10) ? D.fecha_precios : ultimo("SPY").cuando.slice(0, 10);

function comprar(c, t, m) {
  const u = ultimo(t); m = Math.min(m, c.efectivo / (1 + COSTO_OP)); if (m < 0.5) return 0;
  c.efectivo = Math.max(0, c.efectivo - m * (1 + COSTO_OP));
  c.pos[t] = (c.pos[t] || 0) + m / u.precio; c.costo[t] = (c.costo[t] || 0) + m * (1 + COSTO_OP);

  if (c.pos[t] * u.precio < 0.01) { delete c.pos[t]; delete c.costo[t]; }

}
function abrirCuenta() {

}
function aplicarRobot(c, i) {
  const w = D.robots.robots[i].pesos || {}, p = precios(), total = valorCuenta(c);
  ORDEN.forEach(t => { const act = (c.pos[t] || 0) * p[t], quiere = (w[t] || 0) * total; if (act - quiere > 0.5) vender(c, t, act - quiere, quiere < 0.5); });

function difiere(c, i) { const w = pesosCuenta(c), wr = D.robots.robots[i].pesos || {}; return ORDEN.some(k => Math.abs((w[k] || 0) - (wr[k] || 0)) > 0.05); }

const DIAS_V = {semana: 5, mes: 21, "3m": 63, anio: 252};

function gananciaVentana(i, w) {

function sugerir(criterio) {
  const R = D.robots.robots, M = D.historia.metricas, c = cuenta();

  if (criterio === "gano") {
    i = M.reduce((a, m, k) => m.prueba.anual > M[a].prueba.anual ? k : a, 0);
    por = `Desde 2018 fue el que más ganó: en promedio ${pct(M[i].prueba.anual)} al año. Pero en su peor momento llegó a caer ${pct(M[i].prueba.caida, 0)}.`;
  } else if (criterio === "tranquilo") {
    i = M.reduce((a, m, k) => Math.abs(m.prueba.caida) < Math.abs(M[a].prueba.caida) ? k : a, 0);
    por = `Desde 2018 fue el que menos cayó (su peor caída fue ${pct(M[i].prueba.caida, 0)}). A cambio, ganó poco: ${pct(M[i].prueba.anual)} al año.`;
  } else if (criterio === "equilibrado") {
    i = M.reduce((a, m, k) => m.prueba.anual / Math.abs(m.prueba.caida) > M[a].prueba.anual / Math.abs(M[a].prueba.caida) ? k : a, 0);
    por = `Desde 2018 tuvo la mejor mezcla entre ganar y no asustarse: ${pct(M[i].prueba.anual)} al año, con una peor caída de ${pct(M[i].prueba.caida, 0)}.`;
  } else {

/* ---------- gráfico de velas ---------- */
let VELA_ACTUAL = [];
function velasSVG(bars, intervalo) {
  const chico = window.innerWidth < 600, fs = chico ? 13 : 15;
  const maxN = chico ? 40 : 80; bars = bars.slice(-maxN); VELA_ACTUAL = bars;
  const W = chico ? 400 : 760, H = chico ? 250 : 300, L = chico ? 58 : 70, R = 10, T = 12, B = 28, n = bars.length;
  let lo = Math.min(...bars.map(b => b[3])), hi = Math.max(...bars.map(b => b[2]));
  if (hi === lo) { hi += 1; lo -= 1; } const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const paso = (W - L - R) / n, bw = Math.max(2, paso * 0.62);
  const X = i => L + paso * (i + 0.5), Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let g = "";
  const crudo = (hi - lo) / 4, p10 = 10 ** Math.floor(Math.log10(crudo));
  const st = [1, 2, 2.5, 5, 10].map(m => m * p10).find(v => v >= crudo);
  const dec = st < 1 ? 2 : 0;
  for (let t = Math.ceil(lo / st) * st; t <= hi; t += st) {
    g += `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" style="stroke:var(--grid)"/>`;
    g += `<text x="${L - 6}" y="${Y(t) + 5}" text-anchor="end" font-size="${fs}" style="fill:var(--suave)">${t.toFixed(dec)}</text>`;
  }
  const etiqueta = s => { const [f, h] = s.split(" "); const [a, m, d] = f.split("-");
    if (intervalo === "1wk") return `${MESES[+m - 1]} ${a.slice(2)}`;
    if (!h) return `${+d} ${MESES[+m - 1]}`;
    let [hh, mi] = h.split(":").map(Number); return `${hh % 12 || 12}:${String(mi).padStart(2, "0")}`; };
  const cada = Math.ceil(n / (chico ? 4 : 6));
  bars.forEach((b, i) => {
    const [, o, h, l, c] = b, sube = c >= o, col = sube ? "#1A9A55" : "#D64535";
    if ((intervalo === "15m" || intervalo === "1h") && i > 0 && b[0].slice(0, 10) !== bars[i - 1][0].slice(0, 10)) {
      const xd = L + paso * i, [, mm, dd] = b[0].slice(0, 10).split("-");
      g += `<line x1="${xd}" x2="${xd}" y1="${T}" y2="${H - B}" stroke="#9C7A45" stroke-dasharray="3 4"/>`;
      g += `<text x="${xd + 4}" y="${T + fs}" font-size="${fs}" fill="#9C7A45" font-weight="700">${+dd} ${MESES[+mm - 1]}</text>`;
    }
    const y1 = Y(Math.max(o, c)), alto = Math.max(1.5, Math.abs(Y(o) - Y(c)));
    g += `<g onclick="infoVela(${i})" style="cursor:pointer"><rect x="${X(i) - paso / 2}" y="${T}" width="${paso}" height="${H - T - B}" fill="transparent"/>
      <line x1="${X(i)}" x2="${X(i)}" y1="${Y(h)}" y2="${Y(l)}" stroke="${col}" stroke-width="1.5"/>
      <rect x="${X(i) - bw / 2}" y="${y1}" width="${bw}" height="${alto}" fill="${col}" rx="1"/></g>`;
    if ((n - 1 - i) % cada === 0) g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="${fs}" style="fill:var(--suave)">${etiqueta(b[0])}</text>`;
  });
  const ult = bars[n - 1][4];
  g += `<line x1="${L}" x2="${W - R}" y1="${Y(ult)}" y2="${Y(ult)}" style="stroke:var(--enlace)" stroke-dasharray="4 4"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de velas">${g}</svg>`;
}
function infoVela(i) {
  const b = VELA_ACTUAL[i]; if (!b) return;
  const [, o, h, l, c] = b, cambio = c / o - 1;
  document.getElementById("infovela").innerHTML =
    `<b>${cuandoTxt(b[0]).replace("cierre del ", "")}</b>: empezó en ${usd(o, 2)} y terminó en ${usd(c, 2)} ` +

}

}

function simulador() {
  const c = cuenta();
  const noGuarda = almacenOK ? "" : '<div class="aviso oro"><b>Ojo:</b> este navegador no deja guardar. Lo que hagas se perderá al cerrar. Ábrelo en Chrome normal (no en modo incógnito).</div>';
  const msg = simMsg ? `<div class="aviso" style="border-color:var(--verde);background:var(--verde-f)"><b>${esc(simMsg)}</b></div>` : "";
  simMsg = "";
  if (!c) return pantallaBienvenida(noGuarda);

  if (c.auto && c.sigue != null && D.robots.robots[c.sigue] && difiere(c, c.sigue)) {
    aplicarRobot(c, c.sigue);
    AUTO_AVISO = `<div class="aviso oro"><b>🤖 El robot «${esc(D.robots.robots[c.sigue].nombre)}» hizo cambios en tu dinero.</b><br>Ahora tienes: ${esc(tiene(pesosCuenta(c)))}. Mira el detalle en «Lo que he hecho».</div>`;
  }
  anotarValor(c); guardar(c);
  const p = precios(), total = valorCuenta(c), gan = total - c.inicial, invertido = total - c.efectivo;
  const R = D.robots.robots, t = simFondo, u = ultimo(t), abierta = bolsaAbierta();

  // aviso si el robot copiado cambió de idea
  let cambio = "";
  if (!c.auto && c.sigue != null && R[c.sigue]) {
    const wr = R[c.sigue].pesos || {};
    if (difiere(c, c.sigue))
      cambio = `<div class="aviso oro"><b>El robot «${esc(R[c.sigue].nombre)}» cambió de idea.</b><br>Ahora tiene: ${esc(tiene(wr))}.
        <button class="volver ancho" style="margin-top:10px;background:var(--dorado)" onclick="copiarRobot(${c.sigue}, false)">Volver a copiarlo</button></div>`;
  }

  // gráfico de velas
  const serie = VELAS && VELAS[t] && VELAS[t][simIntervalo];
  let grafVelas, variacion = "";

    grafVelas = velasSVG(serie, simIntervalo);

    variacion = `<p class="chica" style="margin:6px 0 0">En lo que muestra el gráfico, el precio ${cv > 0.0005 ? "subió" : cv < -0.0005 ? "bajó" : "casi no cambió"} <b class="${clase(cv)}" style="background:none">${pct(cv, 2)}</b>.</p>`;
  } else {
    grafVelas = `<p class="aviso">Las velas aparecerán apenas se descarguen los precios de la bolsa (se actualizan cada hora mientras está abierta). Mientras tanto puedes comprar y vender con el precio de cierre.</p>`;
  }

  const misFondos = ORDEN.filter(k => (c.pos[k] || 0) * p[k] >= 0.01).map(k => {
    const v = c.pos[k] * p[k], puse = c.costo[k] || 0, g = v - puse;
    return `<li><b>${ACT[k]}</b><br>Pusiste ${usd(puse, 2)} → hoy vale <b>${usd(v, 2)}</b><br>
      <span class="${clase(g)}" style="background:none;font-weight:700">${g >= 0 ? "Vas ganando" : "Vas perdiendo"} ${usd(Math.abs(g), 2)}</span></li>`;
  }).join("");
  const rb = R[simRobot];
  const ops = c.ops.slice(0, 20).map(o => `<li><span class="chica">${cuandoTxt(o.f)}</span><br>

    || "<li>Todavía no has comprado ni vendido nada.</li>";

  return `${barra()}
  <h1>Mi simulador</h1><p class="sub">Dinero de mentira · precios de verdad</p>${noGuarda}${msg}${AUTO_AVISO}${cambio}

  <div class="banner"><span class="chica">Todo mi dinero de práctica vale hoy</span>
    <b style="font-size:40px;margin:4px 0">${usd(total, 2)}</b>${enSoles(total)}
    <span>Empecé con ${usd(c.inicial, 2)} → ${gan >= 0 ? "voy ganando" : "voy perdiendo"} <b>${usd(Math.abs(gan), 2)} (${pct(gan / c.inicial)})</b></span>
    ${c.auto && c.sigue != null ? `<span class="chica" style="display:block;margin-top:8px">🤖 Mi dinero lo maneja el robot «${esc(R[c.sigue].nombre)}»</span>` : ""}</div>
  <div class="grid2" style="grid-template-columns:1fr 1fr">
    <div class="tarjeta" style="margin:0"><span class="chica">💵 Efectivo<br>(guardado, no se mueve)</span><div class="grande" style="font-size:26px">${usd(c.efectivo, 2)}</div></div>
    <div class="tarjeta" style="margin:0"><span class="chica">📦 Invertido<br>(sube y baja con el precio)</span><div class="grande" style="font-size:26px">${usd(invertido, 2)}</div></div>
  </div>

  <h2>Paso 1 · Elige un fondo</h2>
  <div class="chips">${ORDEN.map(k => `<button class="chip" aria-pressed="${t === k}" onclick="simFondo='${k}';trade=null;pintar()">${CORTO[k]}</button>`).join("")}</div>
  <p class="chica" style="margin-top:8px">${QUE_ES[t]}</p>

  <h2>Paso 2 · Mira cómo se mueve el precio</h2>
  <div class="tarjeta">
    <span class="chica">Precio de ${ACT[t]}</span>
    <div class="grande">${usd(u.precio, 2)}</div>
    <p class="chica" style="margin:2px 0 10px">Último precio: ${cuandoTxt(u.cuando)}</p>
    <div class="chips" style="margin-bottom:8px">${INTERVALOS.map(([k, txt]) => `<button class="chip" style="min-height:44px;padding:6px 14px;font-size:16px" aria-pressed="${simIntervalo === k}" onclick="simIntervalo='${k}';pintar()">${txt}</button>`).join("")}</div>

    <p id="infovela" class="chica" style="min-height:22px;margin:8px 0 0">Toca una vela para ver sus números.</p>
    ${AYUDA_VELAS}
    ${NOTA_15MIN}
    <p class="chica" style="margin:8px 0 0">${abierta ? "🟢 La bolsa está <b>abierta</b> ahora." : "🔴 La bolsa está <b>cerrada</b> ahora."}
      Abre de lunes a viernes ${horarioLima()} (hora de Lima). Los precios de esta app se actualizan <b>cada hora</b> mientras está abierta.</p>
  </div>

  <h2>Paso 3 · Compra o vende</h2>
  <div class="grid2" style="grid-template-columns:1fr 1fr">
    <button class="boton" style="justify-content:center;text-align:center;background:var(--verde-btn);border-color:var(--verde-btn);color:#fff;min-height:84px" onclick="abrirTrade('comprar')"><span><b style="color:#fff;font-size:24px">Comprar</b><span style="color:#E3F2E8">poner efectivo aquí</span></span></button>
    <button class="boton" style="justify-content:center;text-align:center;background:var(--rojo-btn);border-color:var(--rojo-btn);color:#fff;min-height:84px" onclick="abrirTrade('vender')"><span><b style="color:#fff;font-size:24px">Vender</b><span style="color:#FBE6E3">sacar dinero de aquí</span></span></button>
  </div>
  ${trade && trade.t === t ? panelTrade(c) : ""}

  <h2>Lo que tengo invertido</h2>
  <div class="tarjeta"><ul class="lista">${misFondos || "<li>Todavía no tienes nada invertido. Todo está en efectivo.</li>"}</ul></div>

  <h2>🏁 ¿Cómo me va comparado con los robots?</h2>
  <p>Aquí ves si tus decisiones le están ganando a los robots, como si cada robot hubiera empezado el mismo día que tú y con tu mismo dinero.</p>
  ${comparativa(c)}

  <h2>🤖 ¿No sabes qué hacer? Deja que un robot decida</h2>
  ${c.auto && c.sigue != null ? `<div class="aviso" style="border-color:var(--verde);background:var(--verde-f)"><b>Ahora tu dinero lo maneja «${esc(R[c.sigue].nombre)}».</b><br>
     Cada vez que abras el simulador, si el robot cambió de idea, tu dinero se acomoda solo.
     <button class="chip ancho" style="margin-top:10px" onclick="apagarAuto()">Apagar: quiero decidir yo</button></div>` : ""}
  <div class="tarjeta"><h3>🧭 ¿Cuál elijo? Que la app te sugiera uno</h3>
    <p class="chica">Toca lo que más te importa:</p>
    <div class="grid2">
      <button class="chip ancho" onclick="sugerir('gano')">🏆 El que más ha ganado</button>
      <button class="chip ancho" onclick="sugerir('tranquilo')">🛡️ El más tranquilo (cae menos)</button>
      <button class="chip ancho" onclick="sugerir('equilibrado')">⚖️ El más equilibrado</button>
      <button class="chip ancho" onclick="sugerir('hoy')">📈 El que va ganando ahora</button>
    </div>

  <p>O elige tú un robot. Toca su nombre para conocerlo:</p>

    <p class="chica" style="margin:6px 0 14px">El robot decide por ti. Cuando cambie de idea, tu dinero se acomoda solo (al abrir el simulador). Si compras o vendes tú, se apaga.</p>

function ayuda() {

  <p class="sub">Toca cada pregunta para ver la respuesta</p>
  ${q("¿Qué es esta app?", "<p>«Trading Algorítmico» es una práctica familiar para aprender a invertir sin arriesgar dinero. Usa los precios reales de la bolsa de Nueva York y se actualiza sola cada día hábil por la tarde.</p>")}
  ${q("¿Es dinero real?", "<p><b>No.</b> Todos los montos son de mentira. Nadie compra ni vende nada de verdad.</p>")}
  ${q("¿Qué es un robot?", "<p>Es una lista de reglas fijas que la computadora sigue al pie de la letra, por ejemplo: «si el mercado viene subiendo, compra; si viene bajando, guarda el dinero». No se asusta ni se emociona. A esto se le llama <b>trading algorítmico</b>.</p>")}
  ${q("¿Qué es una acción, un bono y un fondo?", "<p><b>Acción:</b> un pedacito de una empresa. Puede subir mucho, pero también caer mucho.</p><p><b>Bono:</b> un préstamo a un gobierno o empresa que paga intereses. Se mueve poco y sirve de refugio.</p><p><b>Fondo (ETF):</b> una canasta con cientos de acciones o bonos. Con una sola compra uno reparte el riesgo.</p>")}
  ${q("¿Los robots deciden cada 15 minutos?", "<p><b>No.</b> Cada robot decide <b>una vez al día</b> (al cierre de la bolsa) o <b>una vez al mes</b>. Las velas de 15 minutos o de 1 hora son solo una lupa para ver el precio con más detalle; sirven de referencia, no son una orden de comprar o vender.</p><p>Por eso no hace falta mirar la app a cada rato: una vez al día, o una vez por semana, es suficiente.</p>")}
  ${q("¿Tengo que dejar la app abierta?", "<p><b>No.</b> Todo funciona solo en internet: los precios se actualizan cada hora mientras la bolsa está abierta y los robots hacen sus operaciones al cierre de cada día, aunque tu celular esté apagado. La app solo te muestra los resultados cuando la abres.</p><p>Única excepción: en «Mi simulador», si dejaste que un robot maneje tu dinero, los cambios se aplican la próxima vez que abras el simulador.</p>")}
  ${q("¿Cuándo sabré qué robot es mejor?", "<p>En «¿Quién va ganando?» ya puedes ver desde hoy quién ganó en la última semana, mes o año. Pero para confiar en un robot conviene mirar periodos largos: <b>al menos 3 meses, idealmente 6 o más</b>. En periodos cortos el ganador suele ser cuestión de suerte.</p>")}
  ${q("¿Qué significa el semáforo?", "<p>Resume en un color si las acciones de EE. UU. vienen subiendo (verde), dudando (amarillo) o cayendo (rojo). Describe el pasado reciente; no adivina el futuro.</p>")}
  ${D.robots.robots.map((r, i) => q(`${FICHAS[i].emoji} Robot «${esc(r.nombre)}»`, ficha(i))).join("\n  ")}
  ${q("¿Cada cuánto debemos mirarla?", "<p>Una vez por semana es suficiente. Los robots casi no hacen operaciones: la mayoría decide una sola vez al mes.</p>")}
  ${q("¿Cuándo podremos sacar conclusiones?", "<p>No antes de 3 meses, idealmente a los 6. Con pocas semanas, que un robot gane o pierda es casi pura suerte.</p>")}
  ${q("¿Entonces debemos invertir con un robot?", "<p>Todavía no. En la historia de 20 años, desde 2018 ningún robot le ganó a «Sin hacer nada». La práctica sirve justamente para comprobar con calma si alguno vale la pena antes de arriesgar dinero real. Cualquier decisión se conversa en familia, y no es una recomendación de inversión.</p>")}
  ${q("¿Cómo uso «Mi simulador»?", "<p>Es un juego con dinero de mentira y precios de verdad.</p><p><b>1.</b> Eliges con cuánto empezar (por ejemplo US$ 100). Ese dinero queda en <b>efectivo</b>: guardado, no sube ni baja.</p><p><b>2.</b> Eliges un fondo y miras su gráfico de velas.</p><p><b>3.</b> Tocas <b>Comprar</b> para poner parte de tu efectivo en ese fondo. Desde ahí tu dinero sube o baja junto con el precio.</p><p><b>4.</b> Tocas <b>Vender</b> para sacar el dinero. Vuelve a tu efectivo con lo que ganaste o perdiste.</p><p>Si no quieres decidir, puedes copiar a un robot.</p>")}
  ${q("¿Qué son las velas del gráfico?", "<p>Cada vela es un pedazo de tiempo: 15 minutos, una hora, un día o una semana. <b>Verde</b> = en ese rato el precio subió. <b>Roja</b> = bajó. La rayita fina marca lo más alto y lo más bajo. Los precios se actualizan cada hora mientras la bolsa está abierta.</p>")}

  ${pie()}`;
}

}
window.addEventListener("hashchange", () => pintar(true));
let anchoPrevio = window.innerWidth, tRes;
window.addEventListener("resize", () => { clearTimeout(tRes); tRes = setTimeout(() => {
  if ((anchoPrevio < 600) !== (window.innerWidth < 600) && D) { anchoPrevio = window.innerWidth; pintar(); } }, 200); });

fetch("data.json?v=" + Date.now(), {cache: "no-store"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { D = d; pintar(); })
  .catch(() => { $app.innerHTML = '<div class="cargando"><b>No se pudieron cargar los datos.</b><br>Revisa la conexión a internet y vuelve a abrir la app.</div>'; });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
