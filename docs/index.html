<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuestra Inversión</title>
<meta name="description" content="Práctica familiar de inversión con robots y precios reales">
<meta name="theme-color" content="#1F3A5F">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<style>
:root{
  --fondo:#F4F1EA; --tarjeta:#FFFFFF; --tinta:#1B2430; --suave:#5B6573; --borde:#E2DDD2;
  --azul:#1F3A5F; --azul2:#2C4F7C; --dorado:#9C7A45; --verde:#1A7443; --verde-f:#E3F2E8;
  --rojo:#B42318; --rojo-f:#FBE6E3; --ambar:#A86500; --ambar-f:#FDF0D9;
  --r1:#7D8796; --r2:#B08D57; --r3:#1F3A5F; --r4:#2E86AB; --r5:#7B4FA0; --r6:#D9822B;
  --radio:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:19px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:980px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:30px;line-height:1.15;margin:8px 0 4px;color:var(--azul)}
h2{font-size:24px;line-height:1.2;margin:28px 0 10px;color:var(--azul)}
h3{font-size:20px;margin:0 0 4px}
p{margin:0 0 12px}
.sub{color:var(--suave);font-size:16px}
.chica{font-size:15px;color:var(--suave)}
button,select,input{font:inherit;color:inherit}
.oculto{display:none!important}

/* inicio */
.botones{display:grid;gap:14px;margin-top:18px}
@media(min-width:760px){.botones{grid-template-columns:1fr 1fr}}
.boton{display:flex;align-items:center;gap:16px;width:100%;text-align:left;color:var(--tinta);background:var(--tarjeta);border:2px solid var(--borde);
  border-radius:var(--radio);padding:18px;cursor:pointer;min-height:96px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.boton:active{transform:scale(.99)}
.boton:focus-visible,.volver:focus-visible,.chip:focus-visible{outline:3px solid var(--azul2);outline-offset:2px}
.boton .ico{flex:0 0 60px;height:60px;border-radius:16px;display:grid;place-items:center;font-size:32px;background:#EEF2F7}
.boton b{display:block;font-size:22px;line-height:1.2;color:var(--tinta)}
.boton span{display:block;color:var(--suave);font-size:16px;margin-top:2px}
.boton .flecha{margin-left:auto;font-size:28px;color:var(--suave)}

/* semaforo resumen */
.semaforo{display:flex;gap:16px;align-items:center;border-radius:var(--radio);padding:18px;border:2px solid transparent;cursor:pointer;width:100%;text-align:left;color:var(--tinta)}
.semaforo .luz{flex:0 0 56px;height:56px;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.semaforo b{font-size:23px;display:block;line-height:1.2}
.s-verde{background:var(--verde-f);border-color:#B9DEC6}.s-verde .luz{background:#2E9E5B}
.s-amarillo{background:var(--ambar-f);border-color:#F1D39E}.s-amarillo .luz{background:#E9A23B}
.s-rojo{background:var(--rojo-f);border-color:#F2BDB6}.s-rojo .luz{background:#D64535}

/* pantallas */
.barra{position:sticky;top:0;z-index:5;background:var(--fondo);padding:10px 0 8px;margin:-16px 0 6px}
.volver{display:inline-flex;align-items:center;gap:10px;background:var(--azul);color:#fff;border:0;border-radius:14px;padding:14px 22px;
  font-size:20px;font-weight:700;cursor:pointer;min-height:56px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio);padding:18px;margin:12px 0}
.grid2{display:grid;gap:12px}
.grid2>*,.tarjeta{min-width:0}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.grande{font-size:34px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:700;font-size:17px;white-space:nowrap}
.sube{background:var(--verde-f);color:var(--verde)}.baja{background:var(--rojo-f);color:var(--rojo)}.igual{background:#EEF0F3;color:var(--suave)}
.fila{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.periodos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
@media(min-width:1100px){.periodos{grid-template-columns:repeat(4,1fr)}}
.periodos div{background:#F7F5F0;border-radius:12px;padding:8px;text-align:center}
.periodos small{display:block;color:var(--suave);font-size:14px}
.aviso{background:#EEF2F7;border-left:6px solid var(--azul2);border-radius:12px;padding:14px 16px;margin:14px 0}
.aviso.oro{background:#F6EFE3;border-color:var(--dorado)}
.banner{background:var(--azul);color:#fff;border-radius:var(--radio);padding:18px;margin:12px 0}
.banner b{font-size:23px;display:block;line-height:1.25}
.banner .chica{color:#D3DEEC}
.robot{cursor:pointer}
.robot .cab{display:flex;align-items:center;gap:10px}
.punto{flex:0 0 16px;height:16px;border-radius:50%}
.ref{background:var(--dorado);color:#fff;font-size:12px;font-weight:800;border-radius:6px;padding:2px 8px;letter-spacing:.5px}
.mas{color:var(--azul2);font-size:16px;font-weight:600;margin-top:6px}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 0;font-size:16px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:22px;height:5px;border-radius:3px;display:inline-block}
svg text{font-family:inherit}
.lista{list-style:none;padding:0;margin:0}
.lista li{padding:12px 0;border-bottom:1px solid var(--borde)}
.lista li:last-child{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--borde);background:var(--tarjeta);border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;min-height:52px;font-size:18px}
.chip[aria-pressed=true]{background:var(--azul);border-color:var(--azul);color:#fff}
label.campo{display:block;font-weight:700;margin:16px 0 8px}
select,input[type=number]{width:100%;min-height:58px;border:2px solid var(--borde);border-radius:14px;padding:10px 14px;background:#fff;font-size:20px}
.barras .b{margin:10px 0}
.barras .t{display:flex;justify-content:space-between;gap:10px;font-size:17px}
.barras .pista{height:14px;background:#F0EDE6;border-radius:8px;position:relative;overflow:hidden;margin-top:4px}
.barras .pista i{position:absolute;top:0;bottom:0;border-radius:8px}
details{background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio);margin:10px 0;padding:0 18px}
summary{cursor:pointer;font-weight:700;font-size:20px;padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:"＋";color:var(--azul2)}
details[open] summary::after{content:"－"}
details p,details ul{padding-bottom:6px}
footer{margin-top:30px;color:var(--suave);font-size:14px;text-align:center}
.cargando{padding:60px 0;text-align:center;color:var(--suave)}
.tabla-rank .pos{font-size:22px;font-weight:800;color:var(--suave);width:34px;flex:0 0 34px}
</style>
</head>
<body>
<main id="app"><div class="cargando">Cargando datos…</div></main>

<script>
"use strict";
const COLORES = ["var(--r1)","var(--r2)","var(--r3)","var(--r4)","var(--r5)","var(--r6)"];
const HEX = ["#7D8796","#B08D57","#1F3A5F","#2E86AB","#7B4FA0","#D9822B"];
const ACT = {SPY:"Acciones de EE. UU.",EFA:"Acciones del resto del mundo",IEF:"Bonos del gobierno de EE. UU.",SHY:"Bonos de corto plazo"};
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
let D = null;
const $app = document.getElementById("app");

/* ---------- formato ---------- */
const usd = (x, dec = 0) => "US$ " + Number(x).toLocaleString("es-PE", {minimumFractionDigits: dec, maximumFractionDigits: dec});
const sol = x => "S/ " + Math.round(x).toLocaleString("es-PE");
const pct = (x, dec = 1) => { const v = Math.round(x * 100 * 10 ** dec) / 10 ** dec; return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toLocaleString("es-PE", {minimumFractionDigits: dec, maximumFractionDigits: dec}) + "%"; };
const fecha = iso => { const [a, m, d] = iso.slice(0, 10).split("-"); return `${+d} ${MESES[+m - 1]} ${a}`; };
const clase = x => x > 0.0005 ? "sube" : x < -0.0005 ? "baja" : "igual";
const flecha = x => x > 0.0005 ? "▲" : x < -0.0005 ? "▼" : "●";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tiene = pesos => {
  const p = Object.entries(pesos || {}).filter(([, w]) => w > 0.01).sort((a, b) => b[1] - a[1]);
  const resto = 1 - p.reduce((s, [, w]) => s + w, 0);
  if (resto > 0.01) p.push(["Efectivo", resto]);
  if (!p.length || (p.length === 1 && p[0][0] === "Efectivo")) return "Todo en efectivo (esperando su momento)";
  if (p.length === 1) return "Todo en " + ACT[p[0][0]];
  return p.map(([t, w]) => Math.round(w * 100) + "% " + (ACT[t] || t)).join(" + ");
};

/* ---------- gráfico de líneas en SVG ---------- */
function grafico(series, {alto = 260, log = false, base = null, marca = null, etiquetasX = null} = {}) {
  const chico = window.innerWidth < 600, fs = chico ? 13 : 15;
  const W = chico ? 400 : 760, H = chico ? Math.round(alto * 0.8) : alto, L = chico ? 68 : 80, R = 10, T = 12, B = chico ? 26 : 34;
  const n = Math.max(...series.map(s => s.valores.length));
  if (n < 2) return '<p class="chica">El gráfico aparece cuando haya al menos 2 días de datos.</p>';
  const vals = series.flatMap(s => s.valores).filter(v => v != null && v > 0);
  let lo = Math.min(...vals, base ?? Infinity), hi = Math.max(...vals, base ?? -Infinity);
  const f = log ? Math.log : (v => v);
  let a = f(lo), b = f(hi); if (a === b) { a -= 1; b += 1; }
  const pad = (b - a) * 0.06; a -= pad; b += pad;
  const X = i => L + (W - L - R) * i / (n - 1);
  const Y = v => T + (H - T - B) * (1 - (f(v) - a) / (b - a));
  let g = "";
  // marcas eje Y con números redondos
  let ticks = [];
  const lo2 = log ? Math.exp(a) : a, hi2 = log ? Math.exp(b) : b;
  if (log) {
    for (let e = Math.floor(Math.log10(lo2)); e <= Math.ceil(Math.log10(hi2)); e++)
      for (const m of [1, 2, 5]) { const t = m * 10 ** e; if (t >= lo2 && t <= hi2) ticks.push(t); }
    if (ticks.length > 6) ticks = ticks.filter(t => String(t)[0] === "1" || String(t)[0] === "5");
  } else {
    const crudo = (hi2 - lo2) / 4, p10 = 10 ** Math.floor(Math.log10(crudo));
    const paso = [1, 2, 2.5, 5, 10].map(m => m * p10).find(v => v >= crudo);
    for (let t = Math.ceil(lo2 / paso) * paso; t <= hi2 + 1e-9; t += paso) ticks.push(t);
  }
  const dec = ticks.some(t => Math.abs(t - Math.round(t)) > 1e-6) ? (ticks.some(t => Math.abs(t * 10 - Math.round(t * 10)) > 1e-6) ? 2 : 1) : 0;
  ticks.forEach(t => { const y = Y(t);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#E8E4DB"/>`;
    g += `<text x="${L - 6}" y="${y + 5}" text-anchor="end" font-size="${fs}" fill="#5B6573">${t.toLocaleString("es-PE", {maximumFractionDigits: dec, minimumFractionDigits: dec})}</text>`; });
  if (base != null) g += `<line x1="${L}" x2="${W - R}" y1="${Y(base)}" y2="${Y(base)}" stroke="#1B2430" stroke-dasharray="6 5" stroke-width="1.2"/>`;
  if (marca != null) g += `<line x1="${X(marca)}" x2="${X(marca)}" y1="${T}" y2="${H - B}" stroke="#9C7A45" stroke-dasharray="5 5" stroke-width="1.5"/>`;
  if (etiquetasX) etiquetasX.forEach(([i, txt], j, arr) => {
    const anc = j === 0 && arr.length <= 2 ? "start" : j === arr.length - 1 && arr.length <= 2 ? "end" : "middle";
    g += `<text x="${X(i)}" y="${H - 8}" text-anchor="${anc}" font-size="${fs}" fill="#5B6573">${txt}</text>`; });
  series.forEach(s => {
    const pts = s.valores.map((v, i) => v == null ? null : `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(" ");
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${(s.grueso ? 4 : 2.6) * (chico ? 0.75 : 1)}" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico">${g}</svg>`;
}
function leyenda(nombres) {
  return `<div class="leyenda">${nombres.map((n, i) => `<span><i style="background:${HEX[i]}"></i>${esc(n)}</span>`).join("")}</div>`;
}
function ejeAnios(meses) {
  const out = []; meses.forEach((m, i) => { const y = +m.slice(0, 4);
    if (m.endsWith("-01") && (y % (window.innerWidth < 600 ? 6 : 4) === 0)) out.push([i, String(y)]); });
  return out;
}

/* ---------- pantallas ---------- */
const barra = () => `<div class="barra"><button class="volver" onclick="ir('')">← Volver al inicio</button></div>`;
const pie = () => `<footer>Práctica educativa con dinero ficticio. No es una recomendación de inversión.<br>Precios reales al cierre del ${fecha(D.fecha_precios)}.</footer>`;

function inicio() {
  const m = D.mercado;
  return `
  <h1>Nuestra Inversión</h1>
  <p class="sub">Práctica familiar con precios reales · datos del ${fecha(D.fecha_precios)}</p>
  ${D.demo ? '<div class="aviso oro"><b>Datos de prueba.</b> Estos números son inventados. En unos minutos se reemplazan por precios reales.</div>' : ""}
  <button class="semaforo s-${m.color}" onclick="ir('mercado')" aria-label="Ver cómo está el mercado hoy">
    <span class="luz"></span><span><span class="chica">Hoy, en una frase:</span><b>${esc(m.titular)}</b></span>
  </button>
  <div class="botones">
    ${btn("mercado", "🚦", "¿Cómo está el mercado hoy?", "El semáforo y los precios explicados")}
    ${btn("robots", "🤖", "Competencia de robots", "6 robots con US$ 10,000 de mentira")}
    ${btn("historia", "📜", "Historia de 20 años", "Cómo les fue, incluso en las crisis")}
    ${btn("calculadora", "🧮", "¿Y si hubiera invertido?", "Elige monto y fecha, mira el resultado")}
    ${btn("ayuda", "❓", "¿Qué es todo esto?", "Explicaciones en palabras sencillas")}
  </div>${pie()}`;
}
const btn = (r, ico, t, s) => `<button class="boton" onclick="ir('${r}')"><span class="ico" aria-hidden="true">${ico}</span><span><b>${t}</b><span>${s}</span></span><span class="flecha" aria-hidden="true">›</span></button>`;

function mercado() {
  const m = D.mercado;
  const cards = m.activos.map(a => {
    const serie = a.serie.map(x => x[1]);
    return `<div class="tarjeta">
      <h3>${esc(a.nombre)}</h3>
      <div class="fila"><span class="grande">${usd(a.precio, 2)}</span>
        <span class="pill ${clase(a.dia)}">${flecha(a.dia)} ${pct(a.dia)} hoy</span></div>
      <div class="periodos">
        ${[["Semana", a.semana], ["Mes", a.mes], ["Año", a.anio], ["Desde su máximo", a.desde_maximo]].map(([t, v]) =>
          `<div><small>${t}</small><b class="${v == null ? "" : (v > 0.0005 ? "sube" : v < -0.0005 ? "baja" : "")}" style="background:none">${v == null ? "—" : pct(v)}</b></div>`).join("")}
      </div>
      ${grafico([{valores: serie, color: a.sobre_promedio ? "#1A7443" : "#B42318", grueso: true}], {alto: 170})}
      <p class="chica">${a.sobre_promedio ? "✓ Está por encima de su precio promedio del último año (va subiendo)." : "✗ Está por debajo de su precio promedio del último año (viene bajando)."}</p>
      <p class="chica" style="margin:0">Fondo <b>${a.ticker}</b> · último año</p>
    </div>`;
  }).join("");
  return `${barra()}
  <h1>¿Cómo está el mercado hoy?</h1>
  <p class="sub">Precios de cierre del ${fecha(D.fecha_precios)}</p>
  <div class="semaforo s-${m.color}" style="cursor:default"><span class="luz"></span>
    <span><b>${esc(m.titular)}</b><span style="display:block;margin-top:6px">${esc(m.explicacion)}</span></span></div>
  <div class="aviso"><b>¿Cómo leer el semáforo?</b><br>
    🟢 Verde: las acciones van subiendo y están cerca de su punto más alto.<br>
    🟡 Amarillo: bajaron un poco o están indecisas.<br>
    🔴 Rojo: vienen cayendo con fuerza.<br>
    <span class="chica">El semáforo describe lo que ya pasó; nadie puede adivinar lo que pasará mañana.</span></div>
  <div class="tarjeta"><h3>El dólar hoy</h3><span class="grande">S/ ${m.tipo_cambio.toFixed(2)}</span> <span class="sub">por cada dólar</span>
    <p class="chica" style="margin-top:6px">Las inversiones de esta práctica son en dólares.</p></div>
  <h2>Lo que siguen los robots</h2>
  <p>Estos son los 4 fondos con los que juegan los robots. Cada uno es una "canasta" de cientos de inversiones.</p>
  <div class="grid2">${cards}</div>${pie()}`;
}

function robots() {
  const R = D.robots, ini = R.capital;
  const lista = R.robots.slice();
  const ref = lista[0], mejor = lista.reduce((a, b) => b.valor > a.valor ? b : a);
  const g = mejor.valor / ini - 1;
  const titular = R.dias <= 1 ? "Los robots acaban de empezar. En unos días se verá quién va adelante."
    : g <= 0.0005 ? "Por ahora ningún robot va ganando dinero"
    : (mejor === ref || Math.abs(mejor.valor - ref.valor) < 0.01) ? `Por ahora ningún robot le gana a "Sin hacer nada" (${pct(ref.valor / ini - 1)})`
    : `Va ganando: ${mejor.nombre} (${pct(g)})`;
  const n = Math.max(...lista.map(r => r.serie.length));
  const series = lista.map((r, i) => ({valores: r.serie.map(x => x[1]), color: HEX[i], grueso: i === 0}));
  const etiq = n >= 2 ? [[0, fecha(lista[0].serie[0][0])], [n - 1, fecha(lista[0].serie[n - 1][0])]] : null;
  const tarjetas = lista.map((r, i) => {
    const c = r.valor - ini;
    return `<div class="tarjeta robot" onclick="this.querySelector('.larga').classList.toggle('oculto')" role="button" tabindex="0">
      <div class="cab"><span class="punto" style="background:${HEX[i]}"></span><h3 style="margin:0">${esc(r.nombre)}</h3>${i === 0 ? '<span class="ref">REFERENCIA</span>' : ""}</div>
      <p class="chica" style="margin:4px 0 8px">${esc(r.corta)}</p>
      <div class="fila"><span class="grande">${usd(r.valor)}</span><span class="pill ${clase(c / ini)}">${flecha(c / ini)} ${pct(c / ini)}</span></div>
      <p style="margin:8px 0 0"><b>Ahora tiene:</b> ${esc(tiene(r.pesos))}</p>
      <p class="larga oculto" style="margin:10px 0 0">${esc(r.larga)}</p>
      <div class="mas">Toca para saber cómo piensa</div></div>`;
  }).join("");
  const ops = R.operaciones.slice(0, 15).map(o =>
    `<li><span class="chica">${fecha(o.fecha)}</span><br><b>${esc(o.robot)}</b> <span class="${o.accion === "compró" ? "sube" : "baja"}" style="font-weight:700">${o.accion}</span> ${esc(ACT[o.activo] || o.activo)} por ${usd(o.monto)}</li>`).join("")
    || "<li>Todavía no hay operaciones.</li>";
  return `${barra()}
  <h1>Competencia de robots</h1>
  <p class="sub">Cada robot empezó el ${fecha(R.inicio)} con ${usd(ini)} de mentira · ${R.dias} día${R.dias === 1 ? "" : "s"} de bolsa</p>
  <div class="banner"><b>${esc(titular)}</b>${R.dias < 60 ? '<span class="chica">Aún es muy pronto: con menos de 3 meses, ganar o perder es casi pura suerte.</span>' : ""}</div>
  <div class="tarjeta"><h3>Así va cada robot</h3>
    ${grafico(series, {alto: 250, base: ini, etiquetasX: etiq})}
    ${leyenda(lista.map(r => r.nombre))}
    <p class="chica" style="margin-top:8px">La línea punteada son los ${usd(ini)} iniciales: arriba gana, abajo pierde.</p></div>
  <div class="grid2">${tarjetas}</div>
  <h2>Últimas compras y ventas</h2>
  <p class="chica">Es normal que haya pocas: la mayoría de robots decide solo una vez al mes.</p>
  <div class="tarjeta"><ul class="lista">${ops}</ul></div>${pie()}`;
}

let periodoHist = "todo";
function historia() {
  const H = D.historia;
  const idxDiv = H.meses.indexOf(H.division.slice(0, 7));
  const series = Object.keys(H.curvas).sort().map((k, i) => ({valores: H.curvas[k].map(v => v * 10000), color: HEX[i], grueso: i === 0}));
  const nombres = H.metricas.map(m => m.nombre);
  const rank = H.metricas.map((m, i) => ({...m, i, v: m[periodoHist]})).sort((a, b) => b.v.final - a.v.final);
  const maxCaida = Math.max(...rank.map(x => Math.abs(x.v.caida)));
  const desde = periodoHist === "todo" ? fecha(H.desde).split(" ").slice(1).join(" ") : "ene 2018";
  const tabla = rank.map((x, pos) => `
    <div class="tarjeta tabla-rank"><div class="fila" style="flex-wrap:nowrap;align-items:flex-start">
      <span class="pos">${pos + 1}.</span>
      <div style="flex:1">
        <div class="cab fila"><span class="punto" style="background:${HEX[x.i]}"></span><h3 style="margin:0">${esc(x.nombre)}</h3>${x.i === 0 ? '<span class="ref">REFERENCIA</span>' : ""}</div>
        <p style="margin:6px 0 2px">${usd(10000)} se volvieron <b class="grande" style="font-size:28px">${usd(x.v.final)}</b></p>
        <p style="margin:0">Ganó en promedio <b>${pct(x.v.anual)} al año</b></p>
        <div class="barras"><div class="b"><div class="t"><span>Peor caída en el camino</span><b class="baja" style="background:none">${pct(x.v.caida, 0)}</b></div>
          <div class="pista"><i style="left:0;width:${(Math.abs(x.v.caida) / maxCaida * 100).toFixed(1)}%;background:#D64535"></i></div></div></div>
      </div></div></div>`).join("");
  const crisis = H.crisis.map(c => {
    const mx = Math.max(0.01, ...c.robots.map(x => Math.abs(x.cambio)));
    return `<div class="tarjeta"><h3>${esc(c.titulo)}</h3><p class="chica">Del ${fecha(c.desde)} al ${fecha(c.hasta)}</p>
      <div class="barras">${c.robots.map((x, i) => `<div class="b"><div class="t"><span>${esc(x.nombre)}</span><b class="${clase(x.cambio)}" style="background:none">${pct(x.cambio, 0)}</b></div>
        <div class="pista"><i style="${x.cambio < 0 ? "right:50%" : "left:50%"};width:${(Math.abs(x.cambio) / mx * 50).toFixed(1)}%;background:${x.cambio < 0 ? "#D64535" : "#2E9E5B"}"></i><i style="left:50%;width:2px;background:#9AA3AF;border-radius:0"></i></div></div>`).join("")}</div></div>`;
  }).join("");
  return `${barra()}
  <h1>Historia de 20 años</h1>
  <p class="sub">Qué habría pasado si cada robot hubiera manejado ${usd(10000)} desde ${fecha(H.desde).split(" ").slice(1).join(" ")}</p>
  <div class="tarjeta"><h3>Cómo creció el dinero</h3>
    ${grafico(series, {alto: 280, log: true, marca: idxDiv >= 0 ? idxDiv : null, etiquetasX: ejeAnios(H.meses)})}
    ${leyenda(nombres)}
    <p class="chica" style="margin-top:8px">La línea dorada punteada marca 2018: lo de antes sirvió para "estudiar" las estrategias; lo de después fue el "examen sorpresa".</p></div>
  <h2>Ranking</h2>
  <div class="chips" role="group" aria-label="Periodo">
    <button class="chip" aria-pressed="${periodoHist === "todo"}" onclick="periodoHist='todo';pintar()">Todo el periodo</button>
    <button class="chip" aria-pressed="${periodoHist === "prueba"}" onclick="periodoHist='prueba';pintar()">Desde 2018 (el examen)</button>
  </div>
  <p class="chica" style="margin-top:10px">Ordenado por cuánto dinero había al final. Periodo: ${desde} a ${fecha(D.fecha_precios)}.</p>
  ${tabla}
  <div class="aviso oro"><b>La lección más importante</b><br>Un robot que brilló en el pasado puede decepcionar en el futuro. Por eso miramos aparte el periodo desde 2018: es el examen que los robots no pudieron "estudiar".</div>
  <h2>¿Qué pasó en las crisis?</h2>
  <p>Lo que ganó o perdió cada robot durante las tres caídas más fuertes de estos años.</p>
  ${crisis}${pie()}`;
}

let calc = {monto: 10000, anio: null, mes: 1, modo: "una"};
function calculadora() {
  const H = D.historia;
  const primero = +H.meses[0].slice(0, 4), ultimo = +H.meses[H.meses.length - 1].slice(0, 4);
  if (calc.anio == null) calc.anio = Math.max(primero, ultimo - 10);
  const anios = []; for (let y = primero; y <= ultimo; y++) anios.push(y);
  let k = H.meses.indexOf(`${calc.anio}-${String(calc.mes).padStart(2, "0")}`);
  if (k < 0) k = calc.anio === primero ? 0 : H.meses.length - 2;
  k = Math.min(k, H.meses.length - 2);
  const res = H.metricas.map((m, i) => {
    const c = H.curvas[m.id], last = c[c.length - 1];
    let valorFin, puesto, peor = Infinity, peorRel = 0;
    if (calc.modo === "una") {
      puesto = calc.monto; valorFin = calc.monto * last / c[k];
      for (let t = k; t < c.length; t++) { const v = calc.monto * c[t] / c[k]; if (v < peor) peor = v; }
      peorRel = peor / calc.monto - 1;
    } else {
      let unidades = 0; puesto = 0; let max = 0;
      for (let t = k; t < c.length; t++) { unidades += calc.monto / c[t]; puesto += calc.monto;
        const v = unidades * c[t]; max = Math.max(max, v); peorRel = Math.min(peorRel, v / max - 1); }
      valorFin = unidades * last;
    }
    return {i, nombre: m.nombre, valorFin, puesto, peorRel};
  }).sort((a, b) => b.valorFin - a.valorFin);
  const tc = D.mercado.tipo_cambio;
  const top = res[0];
  const filas = res.map((x, pos) => `<li><div class="fila" style="justify-content:space-between">
      <span class="cab fila"><span class="punto" style="background:${HEX[x.i]}"></span><b>${pos + 1}. ${esc(x.nombre)}</b></span>
      <b style="font-size:22px">${usd(x.valorFin)}</b></div>
      <div class="chica">Ganancia: <b class="${clase(x.valorFin / x.puesto - 1)}" style="background:none">${pct(x.valorFin / x.puesto - 1, 0)}</b> · peor momento: <b class="baja" style="background:none">${pct(x.peorRel, 0)}</b></div></li>`).join("");
  return `${barra()}
  <h1>¿Y si hubiera invertido?</h1>
  <p class="sub">Con los precios reales de los últimos 20 años</p>
  <div class="tarjeta">
    <label class="campo">1. ¿Cómo hubieras invertido?</label>
    <div class="chips"><button class="chip" aria-pressed="${calc.modo === "una"}" onclick="calc.modo='una';pintar()">Una sola vez</button>
      <button class="chip" aria-pressed="${calc.modo === "mes"}" onclick="calc.modo='mes';pintar()">Un poco cada mes</button></div>
    <label class="campo" for="monto">2. ${calc.modo === "una" ? "¿Cuánto? (en dólares)" : "¿Cuánto cada mes? (en dólares)"}</label>
    <div class="chips" style="margin-bottom:10px">${(calc.modo === "una" ? [1000, 5000, 10000, 50000] : [50, 100, 300, 500]).map(v =>
      `<button class="chip" aria-pressed="${calc.monto === v}" onclick="calc.monto=${v};pintar()">${usd(v)}</button>`).join("")}</div>
    <input id="monto" type="number" inputmode="numeric" min="1" value="${calc.monto}" onchange="calc.monto=Math.max(1,+this.value||1);pintar()">
    <label class="campo">3. ¿Desde cuándo?</label>
    <div class="grid2" style="grid-template-columns:1fr 1fr">
      <select aria-label="Mes" onchange="calc.mes=+this.value;pintar()">${MESES_L.map((m, i) => `<option value="${i + 1}" ${calc.mes === i + 1 ? "selected" : ""}>${m}</option>`).join("")}</select>
      <select aria-label="Año" onchange="calc.anio=+this.value;pintar()">${anios.map(y => `<option ${calc.anio === y ? "selected" : ""}>${y}</option>`).join("")}</select>
    </div>
  </div>
  <div class="banner">
    <span class="chica">${calc.modo === "una" ? `Si en ${MESES_L[+H.meses[k].slice(5) - 1]} de ${H.meses[k].slice(0, 4)} hubieras puesto ${usd(calc.monto)} con el mejor robot (${esc(top.nombre)}), hoy tendrías:` :
      `Si desde ${MESES_L[+H.meses[k].slice(5) - 1]} de ${H.meses[k].slice(0, 4)} hubieras puesto ${usd(calc.monto)} cada mes (en total ${usd(top.puesto)}) con el mejor robot (${esc(top.nombre)}), hoy tendrías:`}</span>
    <b style="font-size:40px;margin:6px 0">${usd(top.valorFin)}</b>
    <span class="chica">≈ ${sol(top.valorFin * tc)} al cambio de hoy · en su peor momento llegó a estar ${pct(top.peorRel, 0)}</span>
  </div>
  <h2>Todos los robots</h2>
  <div class="tarjeta"><ul class="lista">${filas}</ul></div>
  <div class="aviso"><b>¿Qué es "peor momento"?</b><br>Es lo más que llegó a caer el dinero en el camino. Por ejemplo, −40% significa que en algún momento ${usd(10000)} llegaron a valer ${usd(6000)}. Ganar mucho al final no sirve si en el camino uno se asusta y vende.</div>
  <p class="chica">Cálculo con precios de fin de mes, incluye un costo de 0.10% por operación. No incluye impuestos.</p>${pie()}`;
}

function ayuda() {
  const q = (t, c) => `<details><summary>${t}</summary>${c}</details>`;
  return `${barra()}
  <h1>¿Qué es todo esto?</h1>
  <p class="sub">Toca cada pregunta para ver la respuesta</p>
  ${q("¿Qué es esta app?", "<p>Es una práctica familiar para aprender a invertir sin arriesgar dinero. Usa los precios reales de la bolsa de Nueva York y se actualiza sola cada día hábil por la tarde.</p>")}
  ${q("¿Es dinero real?", "<p><b>No.</b> Todos los montos son de mentira. Nadie compra ni vende nada de verdad.</p>")}
  ${q("¿Qué es un robot?", "<p>Es una lista de reglas fijas que la computadora sigue al pie de la letra, por ejemplo: «si el mercado viene subiendo, compra; si viene bajando, guarda el dinero». No se asusta ni se emociona. A esto se le llama <b>trading algorítmico</b>.</p>")}
  ${q("¿Qué es una acción, un bono y un fondo?", "<p><b>Acción:</b> un pedacito de una empresa. Puede subir mucho, pero también caer mucho.</p><p><b>Bono:</b> un préstamo a un gobierno o empresa que paga intereses. Se mueve poco y sirve de refugio.</p><p><b>Fondo (ETF):</b> una canasta con cientos de acciones o bonos. Con una sola compra uno reparte el riesgo.</p>")}
  ${q("¿Qué significa el semáforo?", "<p>Resume en un color si las acciones de EE. UU. vienen subiendo (verde), dudando (amarillo) o cayendo (rojo). Describe el pasado reciente; no adivina el futuro.</p>")}
  ${q("Los 6 robots, uno por uno", "<ul>" + D.robots.robots.map(r => `<li><b>${esc(r.nombre)}:</b> ${esc(r.corta)} ${esc(r.larga)}</li>`).join("") + "</ul>")}
  ${q("¿Cada cuánto debemos mirarla?", "<p>Una vez por semana es suficiente. Los robots casi no hacen operaciones: la mayoría decide una sola vez al mes.</p>")}
  ${q("¿Cuándo podremos sacar conclusiones?", "<p>No antes de 3 meses, idealmente a los 6. Con pocas semanas, que un robot gane o pierda es casi pura suerte.</p>")}
  ${q("¿Entonces debemos invertir con un robot?", "<p>Todavía no. En la historia de 20 años, desde 2018 ningún robot le ganó a «Sin hacer nada». La práctica sirve justamente para comprobar con calma si alguno vale la pena antes de arriesgar dinero real. Cualquier decisión se conversa en familia, y no es una recomendación de inversión.</p>")}
  ${q("¿Cómo la instalo en el celular?", "<p>En Android: abre esta página en <b>Chrome</b>, toca los tres puntos ⋮ arriba a la derecha y elige <b>«Agregar a la pantalla principal»</b> o <b>«Instalar app»</b>. Aparecerá un ícono como cualquier otra app.</p>")}
  ${pie()}`;
}

/* ---------- navegación ---------- */
const PANTALLAS = {"": inicio, mercado, robots, historia, calculadora, ayuda};
function ir(r) { location.hash = r ? "#" + r : "#"; }
function pintar(conScroll = false) {
  const r = location.hash.replace("#", "");
  $app.innerHTML = (PANTALLAS[r] || inicio)();
  if (conScroll) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => pintar(true));
let anchoPrevio = window.innerWidth, tRes;
window.addEventListener("resize", () => { clearTimeout(tRes); tRes = setTimeout(() => {
  if ((anchoPrevio < 600) !== (window.innerWidth < 600) && D) { anchoPrevio = window.innerWidth; pintar(); } }, 200); });

fetch("data.json?v=" + Date.now(), {cache: "no-store"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { D = d; pintar(); })
  .catch(() => { $app.innerHTML = '<div class="cargando"><b>No se pudieron cargar los datos.</b><br>Revisa la conexión a internet y vuelve a abrir la app.</div>'; });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
